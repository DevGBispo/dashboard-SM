<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard SM — Operações</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#17221c;background:#f3f6f4}
*{box-sizing:border-box}body{margin:0;min-width:320px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #a2ca4f;outline-offset:3px}
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100dvh}
.sidebar{background:#063f25;color:white;padding:26px 12px}
.sidebar-label{font-size:11px;font-weight:700;letter-spacing:.07em;color:#aacbb6;padding:10px 14px 14px}
.sidebar-button{display:flex;align-items:center;gap:12px;min-height:44px;width:100%;padding:12px 14px;border:0;border-radius:9px;background:#a2ca4f;color:#15331e;text-align:left;font-size:14px;font-weight:700}
.sidebar-icon{font-size:19px;line-height:1}
.main{min-width:0;display:flex;flex-direction:column}
.header{background:#fff;border-bottom:1px solid #dfe7e2;min-height:76px;padding:13px 28px;display:flex;align-items:center;gap:12px}
.logo{font-weight:900;color:#075530;font-size:24px;letter-spacing:-.05em}
.logo span{color:#a2ca4f}
.header-divider{height:30px;width:1px;background:#dfe7e2}
.header-title{font-size:12px;font-weight:800;letter-spacing:.05em;color:#075530}
.content{flex:1;min-width:0;background:#f3f6f4}
@media(max-width:720px){.shell{grid-template-columns:1fr}.sidebar{padding:9px 12px}.sidebar-label{display:none}.sidebar-button{width:auto}.header{min-height:64px;padding:12px 16px}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar" aria-label="Barra lateral">
<div class="sidebar-label">NAVEGAÇÃO</div>
<nav aria-label="Menu principal"><button type="button" class="sidebar-button" aria-current="page"><span class="sidebar-icon" aria-hidden="true">▤</span><span>Operações</span></button></nav>
</aside>
<div class="main">
<header class="header"><div class="logo">S<span>.</span>M</div><div class="header-divider"></div><div class="header-title">S. MAGALHÃES</div></header>
<main class="content" aria-label="Operações"></main>
</div>
</div>
</body>
</html>
